# cargo-deny configuration — supply-chain gate (advisories, licenses, bans, sources).

[advisories]
version = 2
yanked = "deny"
# Suppressed advisories (assessed as not affecting wickra-benchmark). Keep in
# lock-step with osv-scanner.toml.
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.93

# No scoped license exceptions. Everything in the graph resolves under the
# allow-list above; this crate recomputes reports locally and pulls in no TLS
# stack, so there is no CA-bundle crate to except.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# The exchange facade is consumed as a git dependency until its first crates.io
# release; it lives under the project's own GitHub org.
[sources.allow-org]
github = ["wickra-lib"]
