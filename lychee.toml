# Configuration for the lychee link checker (used by the links CI workflow).

# Treat these as success in addition to 2xx.
accept = [200, 206, 429]

# Retry transient failures.
max_retries = 3
retry_wait_time = 2

# Don't hammer hosts.
max_concurrency = 8


# Exclude links that are not meant to resolve at check time: localhost,
# example/placeholder hosts, and the package-registry URLs that 404 until a
# release is published.
exclude = [
  # docs.rs builds a page when a crate is published, and nothing here is yet.
  # The link is right and resolves from the first release onwards; until then it
  # is a 404 that would make this job permanently red and therefore ignored.
  # Remove this entry with the first tag.
  "^https://docs\\.rs/benchmark-core",
    "^https?://localhost",
    "^https?://127\\.0\\.0\\.1",
    "example\\.com",
    "^https?://crates\\.io/crates/wickra-benchmark",
    "^https?://pypi\\.org/project/wickra-benchmark",
    "^https?://www\\.npmjs\\.com/package/wickra-benchmark",
    "^https?://pkg\\.go\\.dev/github\\.com/wickra-lib/wickra-benchmark-go",
    "^https?://crates\\.io/crates/wickra-benchmark-cli",
    "^https?://www\\.nuget\\.org/packages/Wickra\\.Benchmark",
    # The CHANGELOG's own reference links. The first release writes a
    # `releases/tag/vX` link and every one after it a `compare/vA...vB`; the
    # `[Unreleased]` link points at a tag too. All of them 404 between the
    # release commit landing and the tag being pushed, and that gap is
    # deliberate -- a tag is irreversible, so it waits for a human. Excluded
    # for the same reason as the registry URLs above: they resolve after the
    # publish, not before.
    "^https?://github\\.com/wickra-lib/wickra-benchmark/releases/tag/",
    "^https?://github\\.com/wickra-lib/wickra-benchmark/compare/",
    "^https?://central\\.sonatype\\.com/artifact/org\\.wickra/wickra-benchmark",
]
