name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least-privilege default for the auto-injected GITHUB_TOKEN. The publish jobs
# push to external registries via their own secrets, not the GITHUB_TOKEN, so
# they need no repo write. The jobs that genuinely write through the
# GITHUB_TOKEN (github-release, node-/wasm-publish provenance, attestations)
# declare those rights in their own job-level permissions blocks.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Network-flake resilience: retry transient registry/DNS failures at the tool
  # level so a blip fetching crates.io / npm inside any build or publish step
  # retries automatically instead of failing the job.
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_maxtimeout: "120000"
  PIP_RETRIES: "5"
  PIP_DEFAULT_TIMEOUT: "120"

jobs:
  # --------------------------------------------------------------------------
  # crates.io: benchmark-core then the wickra-benchmark-cli crate (wickra-benchmark binary)
  # --------------------------------------------------------------------------
  # --------------------------------------------------------------------------
  # The cut between building and publishing. Everything above it is repeatable;
  # everything below it reaches a registry and cannot be taken back. Without a
  # gate each publish job hangs only off its own build, so a workspace that fails
  # to build for one language still publishes the other five.
  # --------------------------------------------------------------------------
  gate:
    name: Gate the irreversible publish
    needs: [python-wheels, python-sdist, node-build, c-abi-build, cli-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 60 # waits for ci.yml to settle; the wait itself is capped at 45 minutes
    permissions:
      actions: read # list the workflow runs for this commit
      contents: read
    steps:
      - name: Refuse anything that is not a version tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" != "push" ] || [[ "$REF" != refs/tags/v* ]]; then
            echo "::error::refusing to publish from '$REF' (event: $EVENT_NAME) -- only a pushed refs/tags/v* may publish"
            exit 1
          fi
          echo "publishing from $REF"

      - name: The tagged commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # ci.yml that has not finished yet reports conclusion `pending`, which
          # is not the same as a failure -- and a tag pushed shortly after its
          # merge lands while ci.yml is still queued behind this run's own build
          # jobs. Refusing there turns "tagged a minute early" into a failed
          # release, so wait for the verdict rather than reading its absence as
          # one. Bounded to 45 minutes; anything actually red ends this on the
          # spot, so only the undecided case waits.
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            runs=$(gh api --paginate \
              "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              --jq '.workflow_runs[] | [.id, .name, .path, .status, (.conclusion // "pending")] | @tsv')

            if [ -z "$runs" ]; then
              echo "::error::no workflow runs recorded for $SHA -- nothing proves this commit was ever built"
              exit 1
            fi

            # This release run is itself in progress on this SHA; so is anything
            # else still going. Neither is evidence of failure.
            red=$(printf '%s\n' "$runs" | awk -F'\t' -v this="$THIS_RUN" \
              '$1 != this && ($5 == "failure" || $5 == "timed_out" || $5 == "action_required") { print "  " $2 " (" $5 ")" }')
            if [ -n "$red" ]; then
              echo "runs on $SHA:"
              printf '%s\n' "$runs" | cut -f2,4,5
              echo "::error::this commit has failing checks; refusing to publish"
              printf '%s\n' "$red"
              exit 1
            fi

            if printf '%s\n' "$runs" | awk -F'\t' '$3 == ".github/workflows/ci.yml" && $5 == "success"' | grep -q .; then
              break
            fi

            if ! printf '%s\n' "$runs" | awk -F'\t' '$3 == ".github/workflows/ci.yml" && $4 != "completed"' | grep -q .; then
              echo "runs on $SHA:"
              printf '%s\n' "$runs" | cut -f2,4,5
              echo "::error::no successful ci.yml run for $SHA -- tag a commit that has passed CI on main"
              exit 1
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::ci.yml on $SHA did not finish within 45 minutes; refusing to publish"
              exit 1
            fi
            echo "ci.yml on $SHA has not finished yet -- waiting"
            sleep 30
          done

          echo "runs on $SHA:"
          printf '%s\n' "$runs" | cut -f2,4,5
          echo "ci.yml is green on $SHA and nothing else is red"

  cargo-publish:
    needs: gate
    name: Publish to crates.io
    timeout-minutes: 45
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Idempotent publishing: if the version is already on crates.io we treat
      # that as success so re-runs of the workflow do not fail.
      - name: Publish benchmark-core (idempotent)
        run: |
          if out=$(cargo publish -p benchmark-core --token "$CARGO_REGISTRY_TOKEN" 2>&1); then
            echo "$out"
          elif echo "$out" | grep -q "already uploaded\|already exists"; then
            echo "skip: already published"
          else
            echo "$out"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index to refresh
        run: sleep 45

      - name: Publish wickra-benchmark-cli (idempotent)
        run: |
          if out=$(cargo publish -p wickra-benchmark-cli --token "$CARGO_REGISTRY_TOKEN" 2>&1); then
            echo "$out"
          elif echo "$out" | grep -q "already uploaded\|already exists"; then
            echo "skip: already published"
          else
            echo "$out"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Produce .crate files for the GitHub Release attachments.
      - name: Build .crate files for release attachment
        run: |
          cargo package -p benchmark-core
          cargo package -p wickra-benchmark-cli

      - name: Upload .crate files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate-files
          path: target/package/*.crate

      # CycloneDX SBOM per published crate.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOMs
        run: |
          cargo cyclonedx --format json --top-level
          mkdir -p sboms
          cp crates/benchmark-core/benchmark-core.cdx.json sboms/
          cp crates/wickra-benchmark-cli/wickra-benchmark-cli.cdx.json sboms/
          ls -lh sboms/

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: sboms/*.cdx.json

  # --------------------------------------------------------------------------
  # PyPI: cross-platform wheels + sdist
  # --------------------------------------------------------------------------
  python-wheels:
    name: Build wheels (${{ matrix.target }}/${{ matrix.manylinux }} on ${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64, manylinux: auto }
          - { os: macos-latest, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
          - { os: windows-11-arm, target: aarch64, manylinux: auto }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Sync root README into bindings/python so it ships with the wheel
        shell: bash
        run: cp README.md bindings/python/README.md
      # The Python binding depends only on benchmark-core (pure canonicalization +
      # hashing, no native networking), so the manylinux/musllinux containers
      # build the wheel with no extra system dependencies.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --strip --out dist
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: bindings/python/dist/*

  python-sdist:
    name: Build Python sdist
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync root README into bindings/python so it ships in the sdist
        run: cp README.md bindings/python/README.md
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: bindings/python/dist/*

  python-publish:
    name: Publish to PyPI
    timeout-minutes: 45
    needs: [gate, python-wheels, python-sdist]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Upload to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: upload
          args: --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  # --------------------------------------------------------------------------
  # npm: per-platform native binaries + main meta-package
  # --------------------------------------------------------------------------
  node-build:
    name: Node build (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # npm install (not ci): the per-platform optionalDependencies are not yet
      # published, so they are absent from the lock and npm ci would reject it.
      - name: Install Node deps
        run: cd bindings/node && npm install --no-audit --no-fund
      - name: Build native module
        working-directory: bindings/node
        run: npx napi build --platform --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/wickra-benchmark.*.node
          if-no-files-found: error

  node-publish:
    name: Publish to npm
    timeout-minutes: 45
    needs: [gate, node-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore provenance from the GitHub OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install Node deps
        run: cd bindings/node && npm install --no-audit --no-fund
      - name: Download all platform binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bindings/node/artifacts
          pattern: bindings-*
      # The npm/<platform>/package.json templates are committed (bindings/node/npm/),
      # so `napi artifacts` only drops the freshly built .node binary into the
      # matching directory. napi-rs CLI 3 renamed `--dir` to `--output-dir`.
      - name: Move binaries into platform package layout
        working-directory: bindings/node
        run: npx napi artifacts --output-dir artifacts

      - name: Publish platform packages (idempotent)
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          version=$(node -p "require('./package.json').version")
          fail=0
          publish_dir() {
            local dir=$1
            local pkg
            pkg=$(basename "$dir")
            local pkgname="wickra-benchmark-$pkg"
            local existing
            existing=$(npm view "$pkgname@$version" version 2>/dev/null)
            if [ "$existing" = "$version" ]; then
              echo "::notice::skip $pkgname@$version (already on npm)"
              return 0
            fi
            echo "::group::publish $pkgname@$version"
            (cd "$dir" && npm publish --access public --ignore-scripts --provenance)
            local rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::warning::first attempt of $pkgname failed (rc=$rc); retrying after 30s"
              sleep 30
              (cd "$dir" && npm publish --access public --ignore-scripts --provenance)
              rc=$?
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error::$pkgname could not be published — the release would land with a missing platform binary; failing the job."
              return 1
            fi
            return 0
          }
          for dir in npm/*/; do
            publish_dir "$dir" || fail=1
          done
          exit $fail

      - name: Sync root README into bindings/node so it ships with the npm tarball
        shell: bash
        run: cp ../../README.md README.md
        working-directory: bindings/node

      - name: Publish main package to npm (idempotent)
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set +e
          version=$(node -p "require('./package.json').version")
          existing=$(npm view "wickra-benchmark@$version" version 2>/dev/null)
          if [ "$existing" = "$version" ]; then
            echo "::notice::skip wickra-benchmark@$version (already on npm)"
            exit 0
          fi
          npm publish --access public --ignore-scripts --provenance
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::first attempt failed (rc=$rc); retrying after 30s"
            sleep 30
            npm publish --access public --ignore-scripts --provenance
            rc=$?
          fi
          exit $rc

      - name: Pack node tarballs for release attachment
        working-directory: bindings/node
        run: |
          npm pack --ignore-scripts
          for d in npm/*/; do
            (cd "$d" && npm pack --ignore-scripts)
          done

      - name: Upload Node tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-tarballs
          path: |
            bindings/node/*.tgz
            bindings/node/npm/*/*.tgz

  # --------------------------------------------------------------------------
  # WASM: wasm-pack build + npm publish (as `wickra-benchmark-wasm`)
  # --------------------------------------------------------------------------
  wasm-publish:
    needs: gate
    name: Publish wickra-benchmark-wasm to npm
    timeout-minutes: 45
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore provenance from the GitHub OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install wasm-pack (latest, via prebuilt binary)
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: wasm-pack
      - name: Build WASM package (bundler target)
        run: wasm-pack build bindings/wasm --target bundler --release
      - name: Enrich generated package.json with author + repo metadata
        working-directory: bindings/wasm/pkg
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.author = 'kingchenc <support@wickra.org>';
            pkg.repository = { type: 'git', url: 'https://github.com/wickra-lib/wickra-benchmark' };
            pkg.homepage = 'https://github.com/wickra-lib/wickra-benchmark';
            pkg.bugs = { url: 'https://github.com/wickra-lib/wickra-benchmark/issues' };
            pkg.license = 'MIT OR Apache-2.0';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
      - name: Pack wickra-benchmark-wasm for release attachment
        working-directory: bindings/wasm/pkg
        run: npm pack
      - name: Upload WASM tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-tarball
          path: bindings/wasm/pkg/wickra-benchmark-wasm-*.tgz
      - name: Publish wickra-benchmark-wasm to npm (idempotent)
        working-directory: bindings/wasm/pkg
        run: |
          if out=$(npm publish --access public --provenance 2>&1); then
            echo "$out"
          elif echo "$out" | grep -q "You cannot publish over"; then
            echo "skip: version already on npm"
          else
            echo "$out"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --------------------------------------------------------------------------
  # CLI binaries: build the wickra-benchmark executable per platform on a native
  # runner and attach it to the GitHub Release (in addition to `cargo install`).
  # --------------------------------------------------------------------------
  cli-binaries:
    name: CLI binary (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the CLI binary
        run: cargo build -p wickra-benchmark-cli --release --target ${{ matrix.target }}
      - name: Package the binary
        shell: bash
        run: |
          set -e
          dir="wickra-benchmark-${{ matrix.target }}"
          mkdir -p "$dir"
          bin="target/${{ matrix.target }}/release/wickra-benchmark"
          if [ -f "$bin.exe" ]; then
            cp "$bin.exe" "$dir/"
          else
            cp "$bin" "$dir/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: wickra-benchmark-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # C ABI native libraries (bindings/c) — built per target, attached to the
  # GitHub Release and consumed by the C#, Java and Go publish jobs.
  # --------------------------------------------------------------------------
  c-abi-build:
    name: C ABI library (${{ matrix.target }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the C ABI library (cdylib + staticlib)
        run: cargo build -p wickra-benchmark-c --release --target ${{ matrix.target }}
      - name: Package header + libraries
        shell: bash
        run: |
          set -e
          dir="wickra-benchmark-c-${{ matrix.target }}"
          mkdir -p "$dir/include" "$dir/lib"
          cp bindings/c/include/wickra_benchmark.h "$dir/include/"
          for f in libwickra_benchmark.so libwickra_benchmark.a libwickra_benchmark.dylib wickra_benchmark.dll wickra_benchmark.dll.lib wickra_benchmark.lib; do
            src="target/${{ matrix.target }}/release/$f"
            [ -f "$src" ] && cp "$src" "$dir/lib/"
          done
          tar -czf "$dir.tar.gz" "$dir"
          echo "packaged $dir:"; ls -lR "$dir"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c-abi-${{ matrix.target }}
          path: wickra-benchmark-c-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Pack and publish the .NET binding to NuGet. Authentication uses NuGet Trusted
  # Publishing (OIDC) — no long-lived API key. Configure the trusted-publishing
  # policy on nuget.org (owner KingchenC, repo wickra-lib/wickra-benchmark,
  # workflow release.yml) for the Wickra.Benchmark package.
  csharp-publish:
    name: Publish to NuGet
    timeout-minutes: 45
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts
      - name: Stage native libraries into runtimes/<rid>/native
        shell: bash
        run: |
          set -e
          declare -A RID=(
            [x86_64-unknown-linux-gnu]=linux-x64
            [aarch64-unknown-linux-gnu]=linux-arm64
            [x86_64-apple-darwin]=osx-x64
            [aarch64-apple-darwin]=osx-arm64
            [x86_64-pc-windows-msvc]=win-x64
            [aarch64-pc-windows-msvc]=win-arm64
          )
          base=bindings/csharp/WickraBenchmark/runtimes
          for target in "${!RID[@]}"; do
            archive=$(find c-abi-artifacts -name "wickra-benchmark-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            dest="$base/${RID[$target]}/native"; mkdir -p "$dest"
            for f in libwickra_benchmark.so libwickra_benchmark.dylib wickra_benchmark.dll; do
              src=$(find "$tmp" -name "$f" | head -1)
              [ -n "$src" ] && cp "$src" "$dest/"
            done
            echo "staged ${RID[$target]}:"; ls -l "$dest"
          done
      - name: Pack
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 20
          shell: bash
          command: |
            version="${GITHUB_REF_NAME#v}"
            dotnet pack bindings/csharp/WickraBenchmark/WickraBenchmark.csproj -c Release -p:Version="$version" -o nupkg
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget_login
        with:
          user: KingchenC
      - name: Push to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Upload the NuGet package as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: nupkg/*.nupkg
          if-no-files-found: error

  # Publish the Java binding to Maven Central. The org.wickra namespace is
  # verified; auth uses the Sonatype Central token (CENTRAL_USERNAME /
  # CENTRAL_PASSWORD) and artifacts are GPG-signed (GPG_PRIVATE_KEY /
  # GPG_PASSPHRASE). The pom version must match the release tag.
  java-publish:
    name: Publish to Maven Central
    timeout-minutes: 45
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts
      - name: Stage native libraries into resources/native/<os>-<arch>
        shell: bash
        run: |
          set -e
          declare -A PLAT=(
            [x86_64-unknown-linux-gnu]=linux-x64
            [aarch64-unknown-linux-gnu]=linux-arm64
            [x86_64-apple-darwin]=osx-x64
            [aarch64-apple-darwin]=osx-arm64
            [x86_64-pc-windows-msvc]=win-x64
            [aarch64-pc-windows-msvc]=win-arm64
          )
          base=bindings/java/src/main/resources/native
          for target in "${!PLAT[@]}"; do
            archive=$(find c-abi-artifacts -name "wickra-benchmark-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            dest="$base/${PLAT[$target]}"; mkdir -p "$dest"
            for f in libwickra_benchmark.so libwickra_benchmark.dylib wickra_benchmark.dll; do
              src=$(find "$tmp" -name "$f" | head -1)
              [ -n "$src" ] && cp "$src" "$dest/"
            done
            echo "staged ${PLAT[$target]}:"; ls -l "$dest"
          done
      - name: Set up JDK 25 + Maven Central credentials + GPG
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Deploy to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -f bindings/java -Prelease deploy -DskipTests
      # Maven Central gets the jar from the deploy above; the GitHub release page
      # only gets what is uploaded as an artifact and then staged. Without this
      # the jar was the one published artefact with no copy on the release.
      - name: Upload the jar for the release page
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-jar
          path: bindings/java/target/*.jar
          if-no-files-found: error

  # Mirror the in-repo Go module to the standalone wickra-benchmark-go repository so
  # `go get github.com/wickra-lib/wickra-benchmark-go` builds with no extra steps.
  # The mirror commits the prebuilt libraries per platform under
  # lib/<goos>_<goarch>/ alongside the vendored header. The push uses a
  # fine-grained PAT (GO_MIRROR_TOKEN, contents:write on
  # wickra-benchmark-go); the mirror's bot commit is intentionally unsigned.
  go-mirror:
    name: Mirror the Go module to wickra-benchmark-go
    timeout-minutes: 45
    needs: [gate, c-abi-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the C ABI native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: c-abi-artifacts
      - name: Assemble the wickra-benchmark-go module tree
        shell: bash
        run: |
          set -e
          out=wickra-benchmark-go-module
          mkdir -p "$out/include" "$out/lib"
          # Not *.go: the test files search upwards for golden/, which exists
          # in this repository and not in the consumer's module. Copying them
          # ships a module whose `go test ./...` cannot pass.
          for f in bindings/go/*.go; do
            case "$f" in *_test.go) continue ;; esac
            cp "$f" "$out/"
          done
          cp bindings/go/include/wickra_benchmark.h "$out/include/"
          cp bindings/go/README.md "$out/"
          cp LICENSE-MIT LICENSE-APACHE "$out/"
          # The in-repo go.mod already declares the standalone module path.
          cp bindings/go/go.mod "$out/go.mod"
          declare -A GO=(
            [x86_64-unknown-linux-gnu]="linux_amd64 libwickra_benchmark.so"
            [aarch64-unknown-linux-gnu]="linux_arm64 libwickra_benchmark.so"
            [x86_64-apple-darwin]="darwin_amd64 libwickra_benchmark.dylib"
            [aarch64-apple-darwin]="darwin_arm64 libwickra_benchmark.dylib"
            [x86_64-pc-windows-msvc]="windows_amd64 wickra_benchmark.dll"
            [aarch64-pc-windows-msvc]="windows_arm64 wickra_benchmark.dll"
          )
          for target in "${!GO[@]}"; do
            read -r dir libfile <<< "${GO[$target]}"
            archive=$(find c-abi-artifacts -name "wickra-benchmark-c-$target.tar.gz" | head -1)
            if [ -z "$archive" ]; then
              echo "::error::missing native artifact for $target"; exit 1
            fi
            tmp=$(mktemp -d); tar -xzf "$archive" -C "$tmp"
            src=$(find "$tmp" -name "$libfile" | head -1)
            if [ -z "$src" ]; then
              echo "::error::missing $libfile for $target"; exit 1
            fi
            mkdir -p "$out/lib/$dir"; cp "$src" "$out/lib/$dir/"
          done
          echo "assembled module:"; find "$out" -type f | sort
      # Push a module that does not compile and `go get` fails for everyone, with
      # nothing in this repository red. Build it here, against the libraries just
      # staged into it, before it leaves.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false
      - name: Build the assembled module before pushing it
        shell: bash
        run: |
          set -e
          cd wickra-benchmark-go-module
          export CGO_ENABLED=1
          export LD_LIBRARY_PATH="$PWD/lib/linux_amd64:${LD_LIBRARY_PATH:-}"
          go vet ./...
          go build ./...
      - name: Push to wickra-benchmark-go and tag the release
        shell: bash
        env:
          MIRROR_TOKEN: ${{ secrets.GO_MIRROR_TOKEN }}
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          remote="https://x-access-token:${MIRROR_TOKEN}@github.com/wickra-lib/wickra-benchmark-go.git"
          git clone -q "$remote" mirror-repo
          cd mirror-repo
          git config user.name "wickra-bot"
          git config user.email "support@wickra.org"
          git symbolic-ref HEAD refs/heads/main
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r ../wickra-benchmark-go-module/. .
          git add -A
          if git diff --cached --quiet; then
            echo "wickra-benchmark-go already up to date; tagging only"
          else
            git -c commit.gpgsign=false commit -q -m "Release v$version"
          fi
          git push origin HEAD:refs/heads/main
          git tag "v$version"
          git push origin "v$version"

  # --------------------------------------------------------------------------
  # GitHub Release: create a DRAFT, attach every built artefact, then publish-
  # release flips it to published (immutability-ready ordering).
  # --------------------------------------------------------------------------
  github-release:
    name: Attach assets to the draft GitHub Release
    timeout-minutes: 45
    needs: [cargo-publish, python-publish, node-publish, wasm-publish, cli-binaries,
            c-abi-build, csharp-publish, java-publish, go-mirror]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve target tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [[ "$REF" == refs/tags/* ]]; then
            tag="$REF_NAME"
          else
            tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          fi
          if [ -z "$tag" ]; then
            echo "::error::no v* tag found to attach assets to"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "::notice::attaching assets to release $tag"
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Stage release assets
        run: |
          set -e
          mkdir -p release-assets
          find artifacts -type f -name "*.whl" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.node" -exec cp {} release-assets/ \;
          find artifacts -type f -name "wickra-benchmark-*.tgz" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.crate" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.cdx.json" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.nupkg" -exec cp {} release-assets/ \;
          ls -lh release-assets/
          # find, not ls: the count is read by a human in the log, but ls piped
          # to wc miscounts a filename containing a newline.
          echo "asset-count=$(find release-assets/ -type f | wc -l)"
      - name: Create / update the draft GitHub Release with assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: wickra-benchmark ${{ steps.tag.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          draft: true
          body: |
            wickra-benchmark ${{ github.ref_name }} — a reproducible, golden-verified benchmark suite for quant backtests: a curated, hash-pinned collection of `(strategy, dataset, expected report)` cases that anyone recomputes and confirms byte-for-byte, in every language. Native Rust, Python, Node.js, WASM plus a C ABI hub for C, C++, C#, Go, Java, R.

            ### Install

            ```bash
            cargo install wickra-benchmark-cli
            pip install wickra-benchmark
            npm install wickra-benchmark
            dotnet add package Wickra.Benchmark
            go get github.com/wickra-lib/wickra-benchmark-go
            ```

            Java (Maven Central):

            ```xml
            <dependency>
              <groupId>org.wickra</groupId>
              <artifactId>wickra-benchmark</artifactId>
              <version>${{ steps.tag.outputs.version }}</version>
            </dependency>
            ```

            R (r-universe):

            ```r
            install.packages("wickrabenchmark", repos = "https://wickra-lib.r-universe.dev")
            ```

            ### Attached assets

            Pre-built artefacts for every supported platform — the same files this
            workflow run published to crates.io, PyPI, and npm — plus standalone
            CLI binaries and the C ABI libraries. C# ships to NuGet, Java to Maven
            Central, Go to the wickra-benchmark-go module, and R to r-universe via
            their own release jobs.

            ### Auto-generated changelog

            See below; GitHub computes it from the commits since the previous tag.

  # --------------------------------------------------------------------------
  # Build provenance attestations
  # --------------------------------------------------------------------------
  attestations:
    name: Attest build provenance
    timeout-minutes: 45
    needs: [cargo-publish, python-wheels, python-sdist, c-abi-build, csharp-publish,
            java-publish, github-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Download crate files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-files
          path: artifacts/crates
      - name: Download wheels + sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: artifacts/python
          merge-multiple: true
      # The nupkg, the jar and the C ABI archives are published artefacts too.
      # Attesting only the crates and wheels left three of the five ecosystems
      # with no provenance at all.
      - name: Download the NuGet package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: artifacts/nuget
      - name: Download the jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-jar
          path: artifacts/java
      - name: Download the C ABI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: c-abi-*
          path: artifacts/c-abi
          merge-multiple: true
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/crates/*.crate
            artifacts/python/*.whl
            artifacts/python/*.tar.gz
            artifacts/nuget/*.nupkg
            artifacts/java/*.jar
            artifacts/c-abi/*.tar.gz
      - name: Attach provenance bundle to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.github-release.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved from github-release; cannot attach provenance."
            exit 1
          fi
          if [ -z "$BUNDLE" ] || [ ! -f "$BUNDLE" ]; then
            echo "::error::attestation bundle not found at '$BUNDLE'."
            exit 1
          fi
          dest="wickra-benchmark-${TAG}.provenance.intoto.jsonl"
          cp "$BUNDLE" "$dest"
          echo "Uploading $dest to release $TAG"
          gh release upload "$TAG" "$dest" --clobber --repo "${{ github.repository }}"

  # --------------------------------------------------------------------------
  # Publish the drafted release LAST (immutability-ready).
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish the GitHub Release
    timeout-minutes: 45
    needs: [github-release, attestations]
    if: always() && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Flip the draft release to published (latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.github-release.outputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved from github-release; cannot publish."
            exit 1
          fi
          echo "::notice::publishing release $TAG (draft -> published, latest)"
          gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"
