name: CodeQL

# Static analysis security testing across every language surface this repository
# ships. Results appear under Security → Code scanning.
#
# `build-mode: none` analyses source directly. The compiled bindings cannot use
# it: with no build, no dependency resolves, and GitHub reports the analysis as
# low quality (it wants 85% of calls to resolve to a target). C# and Java are
# also the two bindings that hold the C ABI handle with manual lifetimes, so
# they are where a memory mistake is possible at all.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 3 * * 0' # Sundays 03:31 UTC

# Least-privilege default for the auto-injected GITHUB_TOKEN. The analyze job
# raises exactly the scopes CodeQL needs (security-events: write to upload
# results) in its own job-level block below; this top-level read-only default
# covers any future job (OpenSSF Scorecard: Token-Permissions).
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45 # backstop against a hung job, not a budget; the manual modes build from source
    permissions:
      security-events: write # upload CodeQL results to code-scanning
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: csharp
            build-mode: manual
          - language: java-kotlin
            build-mode: manual
          - language: go
            build-mode: manual
          - language: c-cpp
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --- before init: toolchains and non-analysed preconditions -----------

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.language == 'csharp'
        with:
          dotnet-version: "8.0"

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version: "stable"
          cache: false

      # The four compiled surfaces all link the C ABI hub. It is Rust, so it is
      # not part of any of their databases — build it here, before init.
      - uses: ./.github/actions/setup-rust
        if: matrix.build-mode == 'manual'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.build-mode == 'manual'
        continue-on-error: true # cache is an optimisation; never block on a stuck/slow restore
        timeout-minutes: 6
      - name: Build the C ABI library
        if: matrix.build-mode == 'manual'
        run: cargo build -p wickra-benchmark-c --release

      # cgo resolves the library through per-platform LDFLAGS pointing at
      # lib/<goos>_<goarch>/, exactly as ci.yml stages it. Also not analysed
      # code, so also before init.
      - name: Stage the native library for cgo
        if: matrix.language == 'go'
        run: |
          mkdir -p bindings/go/lib/linux_amd64
          cp target/release/libwickra_benchmark.so bindings/go/lib/linux_amd64/

      # --- init -------------------------------------------------------------

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # --- after init: the builds CodeQL traces -----------------------------

      - name: Build the C# binding
        if: matrix.language == 'csharp'
        run: dotnet build bindings/csharp/WickraBenchmark.Tests/WickraBenchmark.Tests.csproj -c Release

      - name: Build the Java binding
        if: matrix.language == 'java-kotlin'
        run: mvn -B -f bindings/java compile

      # `go build ./...` at the repo root finds no go.mod — the module lives
      # under bindings/go, and examples/go is a second module built on its own.
      - name: Build the Go binding and example
        if: matrix.language == 'go'
        run: |
          (cd bindings/go && go build ./...)
          (cd examples/go && go build ./...)

      # Builds the C and C++ examples against the generated header. These are
      # the files a reader copies, which is why they are analysed rather than
      # excluded.
      - name: Build the C and C++ examples
        if: matrix.language == 'c-cpp'
        run: |
          cmake -S examples/c -B examples/c/build
          cmake --build examples/c/build --config Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
