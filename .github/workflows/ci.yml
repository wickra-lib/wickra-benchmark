name: CI

on:
  push:
    branches: [main]
  # Filtered to main: without it every pull request against every branch builds
  # the whole matrix, so a stacked or long-lived branch pays for the full run
  # twice — once against its base and again when that base merges.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        features: ["--all-features", "--no-default-features"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    # The CLI binary (wickra-benchmark) and the C ABI cdylib (wickra_benchmark) share a
    # stem on Windows, so building both in one --workspace pass can race on the
    # same .pdb and trip LNK1201. Dropping debug info (tests do not need it)
    # removes the collision and keeps runner disk use down; RUSTFLAGS is part of
    # the cache key.
    env:
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The PyO3 extension cdylib is built and tested by the `python` job via
      # maturin; the C ABI cdylib by the `c-abi` job. Exclude both here.
      - run: cargo build --workspace ${{ matrix.features }} --exclude wickra-benchmark-python --exclude wickra-benchmark-c
      - run: cargo test --workspace ${{ matrix.features }} --exclude wickra-benchmark-python --exclude wickra-benchmark-c

  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  msrv:
    name: MSRV workspace (1.86)
    runs-on: ubuntu-latest
    timeout-minutes: 20 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The Node binding (napi 3) needs Rust 1.88 and is checked separately; the
      # Python binding needs maturin's platform link flags and is built by the
      # `python` job. The library, CLI, C ABI and WASM stay at 1.86.
      - run: >
          cargo build --workspace
          --exclude wickra-benchmark-python
          --exclude wickra-benchmark-node

  msrv-node:
    name: MSRV node (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p wickra-benchmark-node

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cargo-deny
      - run: cargo deny check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cargo-llvm-cov
      # The moat lives in benchmark-core: recompute + canonicalization + hashing.
      # Measure it in isolation so patch coverage tracks the core.
      - name: Generate coverage (lcov)
        run: >
          cargo llvm-cov
          -p benchmark-core
          --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          # An organization-level upload token carries no repository identity,
          # so Codecov cannot route the upload without an explicit slug and
          # falls back to a tokenless upload, which a protected branch rejects.
          slug: ${{ github.repository }}
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  fuzz-smoke:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cargo-fuzz
      - name: Fuzz case_parse (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu case_parse -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz suite_parse (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu suite_parse -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz run_case (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu run_case -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz command_json (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu command_json -- -max_total_time=30
        working-directory: fuzz

  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The hash-locked set, not a bare `pip install maturin pytest`. Two of
      # them: pytest 9 requires Python 3.10, so a single lock cannot install on
      # the 3.9 row at all -- which is why the previous one, though committed
      # and hash-pinned, was never wired to anything.
      - name: Install the locked dev dependencies
        shell: bash
        run: |
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            python -m pip install --require-hashes -r .github/requirements/ci-dev-py39.txt
          else
            python -m pip install --require-hashes -r .github/requirements/ci-dev-py3.txt
          fi
      - run: maturin build --out dist
        working-directory: bindings/python
      # The wheel this job just built, from disk with the network switched off.
      # There is no hash to pin it to: it does not exist until the line above
      # runs.
      - run: pip install --no-index --find-links bindings/python/dist wickra-benchmark
      # No module here imports pytest, so the 3.9 row runs the same tests
      # without it rather than pinning a vulnerable pytest 8.x to reach them.
      - name: Run the Python tests
        shell: bash
        run: |
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            python bindings/python/tests/run_without_pytest.py
          else
            pytest bindings/python/tests -q
          fi

  node:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      # npm install (not npm ci): the per-platform optionalDependencies point at
      # native packages that are not published until the first release.
      - name: Install Node dependencies
        run: cd bindings/node && npm install --no-audit --no-fund
      - name: Build native module
        run: cd bindings/node && npx napi build --platform --release
      # The generated glue is platform-independent, so a drift check on one OS is
      # enough — and avoids a spurious CRLF/LF diff on the Windows runner.
      - name: Check index.js / index.d.ts are in sync
        if: runner.os == 'Linux'
        run: cd bindings/node && git diff --exit-code -- index.js index.d.ts
      - name: Run Node tests
        run: cd bindings/node && node --test

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install wasm-pack
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: wasm-pack
      - name: Build the wasm binding (web target)
        run: wasm-pack build --target web --out-dir pkg-web
        working-directory: bindings/wasm
      # Golden parity: build for Node into the default `pkg/`, recompute the case
      # through the wasm core and assert it reproduces byte-identically to the
      # native run — the same canonical output every binding produces.
      - name: Build the wasm binding (nodejs target)
        run: wasm-pack build --target nodejs
        working-directory: bindings/wasm
      - name: Assert wasm reproduces the golden fixtures
        run: node --test bindings/wasm/tests/golden.test.js

  c-abi:
    name: C ABI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cbindgen
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cbindgen
      - name: Build the C ABI library (cdylib + staticlib)
        run: cargo build -p wickra-benchmark-c --release
      - name: Rust unit tests
        run: cargo test -p wickra-benchmark-c
      # The generated header is platform-independent, so checking drift on one OS
      # is enough — and avoids a spurious CRLF/LF diff on the Windows runner. This
      # also validates the vendored Go copy.
      - name: Check the C header (cbindgen + Go copy) is in sync
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/check-cbindgen.sh
      # The real cross-language test: a foreign C consumer links the generated
      # header + the compiled library and runs. If this passes on all three OSes,
      # every C-capable language can link the same way.
      - name: Build and run the C example (CMake + ctest)
        shell: bash
        run: |
          cmake -S examples/c -B examples/c/build
          cmake --build examples/c/build --config Release
          ctest --test-dir examples/c/build -C Release --output-on-failure

  go:
    name: Go on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the C ABI library
        run: cargo build -p wickra-benchmark-c --release
      - name: Vendored header in sync with the C ABI
        shell: bash
        run: |
          if ! diff -u bindings/c/include/wickra_benchmark.h bindings/go/include/wickra_benchmark.h; then
            echo "::error::bindings/go/include/wickra_benchmark.h is stale — copy bindings/c/include/wickra_benchmark.h over it"
            exit 1
          fi
      - name: Stage the native library
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::unsupported RUNNER_ARCH '$RUNNER_ARCH'"; exit 1 ;;
          esac
          case "$RUNNER_OS" in
            Linux)   dir="linux_$arch";   lib=target/release/libwickra_benchmark.so ;;
            macOS)   dir="darwin_$arch";  lib=target/release/libwickra_benchmark.dylib ;;
            Windows) dir="windows_$arch"; lib=target/release/wickra_benchmark.dll ;;
          esac
          mkdir -p "bindings/go/lib/$dir"
          cp "$lib" "bindings/go/lib/$dir/"
          echo "WICKRA_GO_LIBDIR=$PWD/bindings/go/lib/$dir" >> "$GITHUB_ENV"
      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l bindings/go)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: Vet and test the Go binding
        shell: bash
        run: |
          export PATH="$WICKRA_GO_LIBDIR:$PATH"
          cd bindings/go
          go vet ./...
          go test ./...

  csharp:
    name: C# on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0"
      # The test project copies the native library from target/release (see the
      # <Content> items), so build it in the release profile here.
      - name: Build the C ABI library
        run: cargo build -p wickra-benchmark-c --release
      - name: Test the C# binding
        run: dotnet test bindings/csharp/WickraBenchmark.Tests/WickraBenchmark.Tests.csproj -c Release

  java:
    name: Java on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The pom points native.lib.dir at target/debug, so build the debug profile.
      - name: Build the C ABI library
        run: cargo build -p wickra-benchmark-c
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Test the Java binding
        run: mvn -B -f bindings/java test

  r:
    name: R on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # backstop against a hung job, not a budget
    env:
      WKBENCH_INC: ${{ github.workspace }}/bindings/c/include
      WKBENCH_LIB: ${{ github.workspace }}/target/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the C ABI library
        run: cargo build -p wickra-benchmark-c --release
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install and test the R binding
        shell: bash
        # github.workspace is a backslash path on Windows; Makevars(.win) (sh) and
        # mingw need forward slashes. The Makevars do not bake an rpath, so the
        # native library must be on the loader path at run time.
        run: |
          export WKBENCH_INC="${WKBENCH_INC//\\//}"
          export WKBENCH_LIB="${WKBENCH_LIB//\\//}"
          if command -v cygpath >/dev/null 2>&1; then
            export PATH="$(cygpath -u "$WKBENCH_LIB"):$PATH"
          else
            export LD_LIBRARY_PATH="$WKBENCH_LIB:$LD_LIBRARY_PATH"
            export DYLD_LIBRARY_PATH="$WKBENCH_LIB:$DYLD_LIBRARY_PATH"
          fi
          R CMD INSTALL bindings/r
          Rscript bindings/r/tests/run_tests.R

  dataset-manifest:
    name: Dataset manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15 # backstop against a hung job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The datasets are the ground truth every case hashes against, so a stray
      # edit must break the build before it can silently change a case's hash.
      - name: Verify dataset blake3 digests against the manifest
        run: |
          python -m pip install --require-hashes -r .github/requirements/manifest.txt
          bash .github/scripts/check-manifest.sh
      # A case is committed in four places (cases/, cases/suite.json, the golden
      # mirror, the runnable copy under examples/data/). Blessing writes all four
      # from one value; this catches the copy a re-bless forgot, which once left
      # examples/data/ stale and only the C example noticed.
      - name: Verify the corpus copies agree
        run: python scripts/check_corpus_sync.py
